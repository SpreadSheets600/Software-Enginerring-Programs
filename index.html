<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A collection of HTML code samples used in software engineering classes, organized by lesson date.">
    <title>Software Engineering - HTML Code Samples</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }

        header p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        main {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }

        h2 {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #999;
            margin-bottom: 1rem;
        }

        .lesson-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.15s;
        }

        .lesson-card:hover {
            border-color: #ccc;
        }

        .lesson-info {
            display: flex;
            flex-direction: column;
        }

        .lesson-info .title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1a1a;
        }

        .lesson-info .meta {
            font-size: 0.8rem;
            color: #999;
        }

        .lesson-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            line-height: 1;
            transition: background-color 0.15s;
        }

        .btn-primary {
            background: #1a1a1a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #333;
        }

        .btn-outline {
            background: transparent;
            color: #555;
            border: 1px solid #ddd;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        footer {
            border-top: 1px solid #e5e5e5;
            background: #ffffff;
            padding: 1.25rem;
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>Software Engineering - HTML Code Samples</h1>
    </header>

    <main>
        <h2>Lessons</h2>

        <div class="lesson-card">
            <div class="lesson-info">
                <span class="title">Basic HTML Elements</span>
                <span class="meta">July 8, 2026</span>
            </div>
            <div class="lesson-actions">
                <a class="btn btn-primary" href="07-08-2026/index.html">Preview</a>
                <a class="btn btn-outline" href="viewer.html?file=07-08-2026/README.md">View Notes</a>
            </div>
        </div>
    </main>
</body>

</html>
