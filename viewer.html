<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Renders lesson README.md files as styled HTML with syntax highlighting.">
    <title>README</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .topbar a:hover {
            color: #666;
        }

        .topbar .label {
            color: #aaa;
            font-size: 0.8rem;
        }

        .container {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 2rem 2.5rem;
        }

        .card h1,
        .card h2 {
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #eee;
            margin: 1.5rem 0 0.75rem;
        }

        .card h1:first-child,
        .card h2:first-child {
            margin-top: 0;
        }

        .card p {
            margin-bottom: 0.75rem;
            color: #555;
        }

        .card ul,
        .card ol {
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .card li {
            margin-bottom: 0.3rem;
            color: #555;
        }

        .card a {
            color: #0969da;
        }

        .card code {
            background: #f6f8fa;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        .card pre {
            background: #f6f8fa;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            margin-bottom: 1rem;
            overflow-x: auto;
        }

        .card pre code {
            display: block;
            padding: 1rem;
            background: none;
            border: none;
            font-size: 0.88em;
        }

        .card blockquote {
            border-left: 3px solid #ddd;
            padding-left: 1rem;
            color: #888;
            margin-bottom: 0.75rem;
        }

        .card table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .card th,
        .card td {
            border: 1px solid #e5e5e5;
            padding: 0.5rem 0.75rem;
            text-align: left;
        }

        .card th {
            background: #f6f8fa;
            font-weight: 600;
        }

        .card hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 1.25rem 0;
        }

        .status {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 1.5rem;
            color: #888;
            text-align: center;
        }

        .error {
            border-color: #d1242f;
            color: #d1242f;
        }

        footer {
            border-top: 1px solid #e5e5e5;
            background: #ffffff;
            padding: 1.25rem;
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <a href="index.html">&larr; Back</a>
        <span class="label" id="file-label"></span>
    </div>

    <div class="container">
        <div class="status" id="status">Loading...</div>
        <div class="card" id="content" hidden></div>
    </div>

    <footer>
        &copy; 2026 Software Engineering Classes
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file') || 'README.md';

        document.getElementById('file-label').textContent = file;

        fetch(file)
            .then((response) => {
                if (!response.ok) {
                    throw new Error('Could not find ' + file);
                }
                return response.text();
            })
            .then((text) => {
                const content = document.getElementById('content');
                content.innerHTML = marked.parse(text);
                content.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                content.hidden = false;
                document.getElementById('status').hidden = true;
                document.title = document.title + ' — ' + file;
            })
            .catch((error) => {
                const status = document.getElementById('status');
                status.textContent = error.message;
                status.classList.add('error');
            });
    </script>
</body>

</html>
