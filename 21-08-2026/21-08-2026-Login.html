<html>
    <head>
        <title>E Commerce Website - Login</title>
    </head>

    <body>
        <nav>
            <table width="100%" border="0">
                <tr>
                    <td align="left">
                        <a href="14-08-2026/14-08-2026.html"><h2>E Commerce Site</h2></a>
                    </td>
                    <td align="center">
                        <input type="text" placeholder="Search For Items" />
                    </td>
                    <td align="right">
                        <a href="21-08-2026-Login.html"
                            ><input type="button" value="Login"
                        /></a>
                        <a href="21-08-2026-Register.html"
                            ><input type="button" value="Register"
                        /></a>
                    </td>
                </tr>
            </table>
        </nav>

        <br /><br /><br />

        <h2 align="center">Login</h2>

        <div align="center">
            <form>
                <fieldset>
                    <table border="0" cellpadding="5">
                        <tr>
                            <td align="right">
                                <label for="username">Username:</label>
                            </td>
                            <td>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Enter Your Username"
                                    required
                                />
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <label for="password">Password:</label>
                            </td>
                            <td>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter Password"
                                    required
                                />
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td align="left">
                                <input type="submit" value="Submit" />
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>
        </div>

        <h4 align="center">
            Forgot Password? <a href="21-08-2026-Register.html">Reset Now!</a>
        </h4>
        <h4 align="center">
            Not Registerd? <a href="21-08-2026-Register.html">Register Now!</a>
        </h4>
    </body>
</html>
